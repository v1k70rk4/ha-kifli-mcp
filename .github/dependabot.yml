version: 2
updates:
  # The add-on's Python dependencies are pinned only here; the Dockerfile and the tests install from it.
  # /tests is not listed: it includes this file, so every update would come twice (#16/#20, #9/#18).
  - package-ecosystem: "pip"
    directory: "/kifli_mcp_connector"
    # raise a ">=" lower bound only when the new version no longer satisfies it, not on every release
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "monthly"
    groups:
      # One PR for all minor/patch bumps; a major bump (e.g. mcp 2.x) gets its own PR
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
