version: 2
updates:
  # The add-on's Python dependencies are pinned only in /kifli_mcp_connector; the Dockerfile and the tests
  # install from it. /tests is listed too, so the dependency graph re-reads tests/requirements.txt (with
  # its -r include): left out, it kept a stale mcp 1.26.0 entry that raised false security alerts
  - package-ecosystem: "pip"
    directories: ["/kifli_mcp_connector", "/tests"]
    schedule:
      interval: "monthly"
    groups:
      # One PR for all minor/patch bumps; a major bump (e.g. mcp 2.x) gets its own PR
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
