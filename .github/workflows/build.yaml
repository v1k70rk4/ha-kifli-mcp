name: Build add-on

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    # Úgy buildelünk, ahogy a Supervisor: csak BUILD_ARCH-ot adunk át (BUILD_FROM-ot nem),
    # mindkét architektúrán natív runneren – így a Dockerfile architektúra szerinti
    # alapképe is tesztelve van (2.0.0-ban ez aarch64-en elbukott, lásd #1).
    name: "build (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-latest"
          - arch: "aarch64"
            runner: "ubuntu-24.04-arm"
    runs-on: "${{ matrix.runner }}"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: "Test build (${{ matrix.arch }})"
        run: |
          docker build \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --tag local/kifli_mcp_connector:${{ matrix.arch }} \
            kifli_mcp_connector
