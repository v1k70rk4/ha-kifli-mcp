name: Lint add-on

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Add-on linter
        uses: "frenck/action-addon-linter@v2"
        with:
          path: "./kifli_mcp_connector"
