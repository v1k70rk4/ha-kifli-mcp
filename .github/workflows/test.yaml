name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"
      - run: "python -m pip install -r tests/requirements.txt"
      - run: "python -m pytest"
