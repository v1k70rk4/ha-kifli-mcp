name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.13"
      - run: "python -m pip install -r tests/requirements.txt"
      - run: "python -m pytest"
