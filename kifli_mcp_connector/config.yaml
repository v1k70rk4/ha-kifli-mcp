name: "Rohlik Group (hu, cz, at, de, ro) MCP Connector"
slug: "kifli_mcp_connector"
version: "2.1.1"
description: "Bridges the Rohlik Group MCP (hu/cz/at/de/ro) to SSE for the Home Assistant MCP client, with OAuth sign-in and schema shim."
url: "https://github.com/v1k70rk4/ha-kifli-mcp"

arch:
  - amd64
  - aarch64

startup: services
init: false

# 2.0: nincs host hálózat (alapértelmezés) – az SSE portot a 'ports' mappelés
# adja, az ingress a Supervisor felől éri el az add-ont.
ports:
  42783/tcp: 42783

ports_description:
  42783/tcp: "MCP Proxy SSE endpoint (Home Assistant MCP integration URL: http://<ha-ip>:42783/sse)"

# Bejelentkező oldal a HA oldalsávban (OAuth kód beillesztése)
ingress: true
ingress_port: 42784
panel_icon: "mdi:cart"
panel_title: "Kifli MCP"

# A sikeres bejelentkezés után az add-on újratölti a HA MCP-integrációt
homeassistant_api: true

options:
  port: 42783
  country: "hu"
  mcp_url: ""
  new_tools_enabled: false

schema:
  port: int
  country: "list(hu|cz|at|de|ro)?"
  mcp_url: "str?"
  # Az upstream listán újonnan megjelenő eszközök bekapcsolva érkezzenek-e
  new_tools_enabled: "bool?"
  # 1.x maradvány – 2.0 óta nem használt, csak azért van itt, hogy a régi
  # konfiguráció ne akadjon fenn a sémaellenőrzésen
  email: "str?"
  password: "password?"
