name: "Rohlik Group (hu, cz, at, de, ro) MCP Connector"
slug: "kifli_mcp_connector"
version: "1.2.0"
description: "Bridges the Rohlik Group MCP (hu/cz/at/de/ro) to SSE for the Home Assistant MCP client, with schema shim."
url: "https://github.com/v1k70rk4/ha-kifli-mcp"

arch:
  - amd64
  - aarch64

startup: services
init: false

host_network: true

ports:
  42783/tcp: 42783

ports_description:
  42783/tcp: "MCP Proxy SSE endpoint"

webui: "http://[HOST]:[PORT:42783]"

options:
  port: 42783
  country: "hu"
  email: ""
  password: ""
  mcp_url: ""

schema:
  port: int
  country: "list(hu|cz|at|de|ro)?"
  email: str
  password: password
  mcp_url: "str?"
